server {
    listen 80;
    listen  [::]:80;

    server_name frontend;
    root /usr/share/nginx/html;

    # compress text assets (the main bundle shrinks from ~1MB to ~300KB)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml font/ttf application/vnd.ms-fontobject;

    # hashed build output, file names change on every build
    location ~* ^/(js|css)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # rarely changing static files
    location ~* ^/(webfonts|webfonts-preview|images|sounds)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # data that can change on deploy, revalidated with etags after an hour
    location ~* ^/(quotes|languages|layouts|themes|challenges|funbox)/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # always check for a new version
    location ~* ^/(sw\.js|version\.json|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
